name: screen-time-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - jupyterlab
  - pandas
  - numpy
  - scipy
  # Versiones fijadas: los modelos .joblib solo se cargan de forma fiable
  # con las mismas versiones con que se guardaron (notebooks/Modelado.ipynb)
  - scikit-learn=1.9.1
  - xgboost=3.4.2
  - lightgbm=4.7.0
  - catboost=1.2.9
  - joblib=1.6.0
  - matplotlib
  - seaborn
  - pip
  - statsmodels
  - nodejs
  - pip:
      - mystmd
