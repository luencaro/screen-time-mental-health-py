services:
  jupyter:
    # Nombre fijo de la imagen: .devcontainer/ la construye con initializeCommand y luego la reutiliza
    image: screen-time-jupyter:cpu
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    container_name: screen-time-jupyter

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "8050:8050"
    volumes:
      - .:/workspace
    environment:
      - DASH_DEBUG=1
    container_name: screen-time-dashboard
